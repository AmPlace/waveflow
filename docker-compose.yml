services:
  backend:
    image: ghcr.io/amplace/waveflow-backend:${WAVEFLOW_RELEASE_VERSION:?WAVEFLOW_RELEASE_VERSION_required}
    container_name: waveflow-backend
    labels:
      org.opencontainers.image.version: ${WAVEFLOW_RELEASE_VERSION:?WAVEFLOW_RELEASE_VERSION_required}
    expose:
      - "8000"
    environment:
      WAVEFLOW_MODE: ${WAVEFLOW_MODE:-nas}
      WAVEFLOW_ALLOWED_ORIGINS: ${WAVEFLOW_ALLOWED_ORIGINS:-}
      WAVEFLOW_PRODUCTION: ${WAVEFLOW_PRODUCTION:-}
      WAVEFLOW_PROXY_HANDLE_SECRET: ${WAVEFLOW_PROXY_HANDLE_SECRET:-}
      WAVEFLOW_SESSION_SECRET: ${WAVEFLOW_SESSION_SECRET:-}
      HITFM_COOKIE: ${HITFM_COOKIE:-}
    volumes:
      - waveflow-data:/app/data
    networks:
      - waveflow-net
    restart: unless-stopped

  # 前端服务
  frontend:
    image: ghcr.io/amplace/waveflow-frontend:${WAVEFLOW_RELEASE_VERSION:?WAVEFLOW_RELEASE_VERSION_required}
    container_name: waveflow-frontend
    labels:
      org.opencontainers.image.version: ${WAVEFLOW_RELEASE_VERSION:?WAVEFLOW_RELEASE_VERSION_required}
    depends_on:
      - backend
    ports:
      - "${WAVEFLOW_PORT:-8080}:80"
    networks:
      - waveflow-net
    restart: unless-stopped

networks:
  waveflow-net:
    driver: bridge

volumes:
  waveflow-data:
