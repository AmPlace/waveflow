name: Build and Push IPTV Docker Image

on:
  push:
    branches:
      - iptv

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: 1. 拉取最新代码
        uses: actions/checkout@v4

      - name: 2. 准备小写用户名
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: 3. 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. 构建并推送【后端】不可变提交镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/waveflow-backend:${{ env.IMAGE_TAG }}

      - name: 5. 构建并推送【前端】不可变提交镜像
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/waveflow-frontend:${{ env.IMAGE_TAG }}
